name: Import site photos into repository (one-time)
on:
  push:
    paths:
      - '.github/workflows/import-site-photos.yml'
permissions:
  contents: write
jobs:
  import-site-photos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install image processing dependencies
        run: python -m pip install --disable-pip-version-check requests Pillow
      - name: Download photos, optimize and replace external image URLs
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from PIL import Image, ImageOps
          import requests

          html_path = Path('index.html')
          html = html_path.read_text(encoding='utf-8')
          assets = {
              'https://images.unsplash.com/photo-1524504388940-b1c1722653e1?auto=format&amp;fit=crop&amp;w=1200&amp;q=85': 'images/hero-portrait.webp',
              'https://avatars.mds.yandex.net/get-altay/8072793/2a00000185a04b29ca5dbd5e6572f587cffa/XXL_height': 'images/salon-interior.webp',
              'https://avatars.mds.yandex.net/get-altay/1047383/2a00000185a04b76111514a29722342b1973/XXL_height': 'images/salon-lounge.webp'
          }
          session = requests.Session()
          session.headers.update({'User-Agent':'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/131.0.0.0 Safari/537.36',
                                  'Accept':'image/avif,image/webp,image/apng,image/*,*/*;q=0.8','Referer':'https://yandex.ru/'})
          for url, target in assets.items():
              assert url in html, f'Original image URL not found: {url}'
              response = session.get(url.replace('&amp;','&'), timeout=45)
              response.raise_for_status()
              if len(response.content)>14*1024*1024:
                  raise RuntimeError('Image exceeds 14 MB: '+target)
              with Image.open(BytesIO(response.content)) as im:
                  im.load()
                  print(f'{url} => {im.format}, {im.size}', flush=True)
                  if im.width<350 or im.height<300:
                      raise RuntimeError('Suspiciously small image: '+target)
                  im = ImageOps.exif_transpose(im).convert('RGB')
                  im.thumbnail((1600,1800),Image.Resampling.LANCZOS)
                  path = Path(target)
                  path.parent.mkdir(parents=True, exist_ok=True)
                  im.save(path,'WEBP',quality=86,method=6)
              html=html.replace(url,target)
              print(f'Saved {target}: {path.stat().st_size} bytes',flush=True)
          import re
          external=[u for u in re.findall(r'<img\b[^>]*\bsrc="([^"]+)"',html,re.I) if u.startswith(('http://','https://'))]
          if external: raise RuntimeError('External images remain: '+str(external))
          html_path.write_text(html, encoding='utf-8')
          PY
      - name: Commit local photos and site references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html images/hero-portrait.webp images/salon-interior.webp images/salon-lounge.webp
          git diff --cached --check
          git commit -m "Self-host hero and salon photos in GitHub Pages"
          git push
